#################################
##
## File configuration

pipeline_folder: "/users/fischerd/git/Snakebite-miRNA/"

features-file: "config/features.yaml"
params-file: "config/params.yaml"
docker-file: "config/.docker.yml"
sample-file: "config/samples.tsv"
sampleinfo-file: "config/samples.tsv"   # kept as a separate key so the report script can be pointed at a different table if needed

tmp_storage: "$TMP"
nvme_storage: "$LOCAL_SCRATCH"
shm_storage: "/dev/shm"      # If shm is not available, set to a fast disc (same as nvme_storage), if that is not available, point it to a regular disc (like tmp_storage)

#################################
##
## Server configuration

resource_sets:
  small:
    runtime: 300
    mem_mb: 16000
    cpus: 1
    partition: "small"
    nvme: "nvme:0"

  medium:
    runtime: 4000
    mem_mb: 160000
    cpus: 10
    partition: "small"
    nvme: "nvme:0"

  medium_nvme:
    runtime: 4000
    mem_mb: 160000
    cpus: 10
    partition: "small"
    nvme: "nvme:10"

  large:
    runtime: 4000
    mem_mb: 320000
    cpus: 20
    partition: "small"
    nvme: "nvme:0"

  large_nvme:
    runtime: 4000
    mem_mb: 320000
    cpus: 20
    partition: "small"
    nvme: "nvme:50"

  highmem:
    runtime: 4000
    mem_mb: 1400000
    cpus: 20
    partition: "hugemem"
    nvme: "nvme:250"

  longrun:
    runtime: 20000
    mem_mb: 320000
    cpus: 20
    partition: "longrun"
    nvme: "nvme:250"

  highmem_longrun:
    runtime: 20000
    mem_mb: 1400000
    cpus: 20
    partition: "hugemem_longrun"
    nvme: "nvme:250"

  full_node:
    runtime: 4000
    mem_mb: 360000
    cpus: 40
    partition: "small"
    nvme: "nvme:1000"
